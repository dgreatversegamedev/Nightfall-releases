<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nightfall – Download</title>
<style>
  :root{--bg:#07080d;--card:#10121a;--text:#eee;--dim:#9a9aa5;--accent:#2f6bff;--glow:#2f6bff55;--ok:#2fd27a;--bad:#ff5d5d}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(ellipse at 50% 0%,#0f1a3a 0%,var(--bg) 60%) fixed;
       color:var(--text);font-family:system-ui,sans-serif;line-height:1.5;min-height:100vh}
  main{max-width:640px;margin:0 auto;padding:24px 16px}
  .hero{text-align:center}
  .helmet{width:min(78%,340px);height:auto;display:block;margin:0 auto -10px;
          filter:drop-shadow(0 0 28px var(--glow));animation:float 5s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  h1{margin:0 0 4px;letter-spacing:6px;font-size:2.2rem;text-shadow:0 0 18px var(--glow)}
  h2{margin:0 0 4px}
  .sub{color:var(--dim);margin-bottom:24px}
  .card .sub{margin-bottom:8px}
  .card{background:var(--card);border:1px solid #1d2233;border-radius:12px;padding:18px;margin-bottom:16px}
  .btn{display:block;width:100%;border:0;cursor:pointer;text-align:center;background:var(--accent);color:#fff;text-decoration:none;
       padding:15px 22px;border-radius:10px;font-weight:700;font-size:1.05rem;margin-top:14px;font-family:inherit;
       box-shadow:0 0 22px var(--glow);animation:pulse 2.4s ease-in-out infinite}
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.6;animation:none;cursor:default}
  .btn.alt{background:#1d2233;box-shadow:none;animation:none}
  @keyframes pulse{0%,100%{box-shadow:0 0 14px var(--glow)}50%{box-shadow:0 0 30px #2f6bffaa}}
  .size{display:block;text-align:center;color:var(--dim);font-size:.85rem;margin-top:8px}
  .notes{white-space:pre-wrap;color:var(--dim);margin-top:8px}
  .prog{display:none;margin-top:14px}
  .bar{height:12px;background:#1d2233;border-radius:99px;overflow:hidden}
  .fill{height:100%;width:0;background:var(--accent);box-shadow:0 0 12px var(--glow);transition:width .15s}
  .ptxt{display:flex;justify-content:space-between;color:var(--dim);font-size:.85rem;margin-top:6px}
  .msg{margin-top:12px;text-align:center;font-size:.95rem}
  .msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
  .warn{display:none;background:#2a2410;border:1px solid #5a4a14;color:#ffd96b;border-radius:10px;padding:12px;margin-bottom:16px;font-size:.92rem}
  footer{color:var(--dim);font-size:.85rem;text-align:center;margin-top:30px}
  footer a{color:var(--dim)}
</style>
</head>
<body>
<main>
  <div class="hero">
    <img class="helmet" src="helmet.png" alt="Nightfall helmet">
    <h1>NIGHTFALL</h1>
    <div class="sub">Android updates</div>
  </div>

  <div class="warn" id="inapp">
    You're inside an app's browser (TikTok, etc.), which can block APK downloads.
    Tap <b>Open in Chrome</b> below for a smooth download.
    <a class="btn alt" id="chromeBtn" href="#">Open in Chrome</a>
  </div>

  <div class="card" id="latest">
    <div id="info">Checking for the latest version…</div>
    <button class="btn" id="dl" type="button">Download Nightfall APK</button>

    <div class="prog" id="prog">
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="ptxt"><span id="pct">0%</span><span id="mb"></span></div>
    </div>
    <div class="msg" id="msg"></div>
    <span class="size" id="size"></span>
  </div>

  <footer><a href="privacy.html">Privacy Policy</a></footer>
</main>

<script>
const REPO = "dgreatversegamedev/Nightfall-releases";

// Backup name, only used if GitHub's release info can't be loaded.
const APK_NAME = "Nightfall.apk";

// APK copied next to this page by your release workflow (same site = no browser block).
const LOCAL_APK = "Nightfall-latest.apk";

const $ = id => document.getElementById(id);
const dl = $("dl"), info = $("info"), sizeEl = $("size");
const prog = $("prog"), fill = $("fill"), pct = $("pct"), mb = $("mb"), msg = $("msg");

let asset = null;                 // {id, name, size, url}
const backupLink = `https://github.com/${REPO}/releases/latest/download/${APK_NAME}`;

// ---- In-app browser detection (TikTok, Instagram, Facebook, generic WebView) ----
const ua = navigator.userAgent;
const inApp = /TikTok|musical_ly|Bytedance|Instagram|FBAN|FBAV|Snapchat|Line\/|; wv\)/i.test(ua);
if (inApp && /Android/i.test(ua)) {
  $("inapp").style.display = "block";
  const u = new URL(location.href);
  $("chromeBtn").href =
    `intent://${u.host}${u.pathname}${u.search}#Intent;scheme=https;package=com.android.chrome;end`;
}

function setMsg(text, cls){ msg.textContent = text; msg.className = "msg " + (cls || ""); }

// ---- Download inside THIS page, so Chrome's "keep this file?" prompt shows here ----
async function startDownload(){
  if (!asset) { location.href = backupLink; return; }

  dl.disabled = true;
  dl.textContent = "Downloading…";
  prog.style.display = "block";
  setMsg("");
  fill.style.width = "0%"; pct.textContent = "0%";

  try {
    let res = null;
    try {                                   // 1) same-site copy (never blocked)
      const l = await fetch(LOCAL_APK, { cache: "no-store" });
      if (l.ok && l.body) res = l;
    } catch (_) {}
    if (!res) {                             // 2) straight from GitHub release
      res = await fetch(asset.url, { headers: { Accept: "application/octet-stream" } });
    }
    if (!res.ok || !res.body) throw new Error("HTTP " + res.status);

    const total = Number(res.headers.get("content-length")) || asset.size;
    const reader = res.body.getReader();
    const chunks = [];
    let got = 0;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      got += value.length;
      const p = Math.min(100, (got / total) * 100);
      fill.style.width = p.toFixed(1) + "%";
      pct.textContent = Math.floor(p) + "%";
      mb.textContent = (got / 1048576).toFixed(1) + " / " + (total / 1048576).toFixed(1) + " MB";
    }

    fill.style.width = "100%"; pct.textContent = "100%";
    const blob = new Blob(chunks, { type: "application/vnd.android.package-archive" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = asset.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);

    setMsg("Downloaded. If Chrome asks to keep the file, tap Download/Keep, then open it to install.", "ok");
    dl.textContent = "Download again";
    dl.disabled = false;
  } catch (e) {
    setMsg("Download failed. Check your connection and tap Retry.", "bad");
    dl.textContent = "Retry download";
    dl.disabled = false;
    prog.style.display = "none";
  }
}
dl.addEventListener("click", startDownload);

// ---- Load latest release info ----
async function load(){
  try{
    const res = await fetch(`https://api.github.com/repos/${REPO}/releases/latest`, { cache: "no-store" });
    if(!res.ok) throw new Error(res.status);
    const r = await res.json();
    if (r.tag_name === shownTag) return;   // nothing new, keep the page as is
    shownTag = r.tag_name;
    const apk = (r.assets || []).find(a => a.name.toLowerCase().endsWith(".apk"));

    info.innerHTML = "";
    const h = document.createElement("h2");
    h.textContent = "Latest: " + (r.name || r.tag_name);
    const d = document.createElement("div");
    d.className = "sub";
    d.textContent = new Date(r.published_at).toLocaleDateString();
    const n = document.createElement("div");
    n.className = "notes";
    n.textContent = r.body || "";
    info.append(h, d, n);

    // Tell returning visitors when a newer version has come out since their last visit
    try {
      const seen = localStorage.getItem("nf_seen");
      if (seen && seen !== r.tag_name) {
        const b = document.createElement("div");
        b.className = "msg ok";
        b.textContent = "New update available!";
        info.prepend(b);
      }
      localStorage.setItem("nf_seen", r.tag_name);
    } catch (_) {}

    if(apk){
      asset = {
        id: apk.id,
        name: apk.name,
        size: apk.size,
        url: `https://api.github.com/repos/${REPO}/releases/assets/${apk.id}`
      };
      sizeEl.textContent = r.tag_name + " · " + (apk.size / 1048576).toFixed(1) + " MB · APK";
    }
  }catch(e){
    if (!shownTag) info.textContent = "Get the latest version of Nightfall:";
  }
}
let shownTag = "";
load();

// Check again whenever the visitor comes back to the page or tab
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && !dl.disabled) load();
});
window.addEventListener("pageshow", e => { if (e.persisted && !dl.disabled) load(); });
</script>
</body>
</html>
